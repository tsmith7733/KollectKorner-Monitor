name: Kollect Korner One Piece Preorder Watch

on:
  schedule:
    # Every 15 minutes. GitHub may delay this somewhat during high load.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "preorder-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_products.json
          git diff --quiet --cached || git commit -m "Update seen products [skip ci]"
          git push
